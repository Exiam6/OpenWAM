model:
  video_backbone:
    encoder:
      name: dinov3_temporal
      model_path: /data02/zifanz4/openwam-experiments/assets/dinov3-study/dinov3
      svae_path: /data02/zifanz4/openwam-experiments/endtoend-20260923/compressors-multiview/svae-final.pt
      svae_target_dim: 48
    name: wan22_ti2v_5b
    model_path: /path/to/Wan2.2-TI2V-5B
    from_scratch: true
    shift_video: 5.0
    components:
    - attr: dit
      model_class: openwam.model.video_backbone.wan.models.dit.WanModel
      extra_kwargs:
        has_image_input: false
        patch_size:
        - 1
        - 2
        - 2
        in_dim: 48
        dim: 1024
        ffn_dim: 4096
        freq_dim: 256
        text_dim: 4096
        out_dim: 48
        num_heads: 8
        num_layers: 12
        eps: 1.0e-06
        seperated_timestep: true
        require_clip_embedding: false
        require_vae_embedding: false
        fuse_vae_embedding_in_latents: true
    - attr: vae
      model_class: openwam.model.video_backbone.wan.models.vae.WanVideoVAE38
      extra_kwargs: {}
    - attr: text_encoder
      model_class: openwam.model.video_backbone.wan.models.text_encoder.WanTextEncoder
      extra_kwargs: {}
    tokenizer:
      class: openwam.model.video_backbone.wan.models.text_encoder.HuggingfaceTokenizer
      attr: tokenizer
      subdir: tokenizer/google/umt5-xxl
      path_kwarg: name
      kwargs:
        seq_len: 512
        clean: whitespace
  action_backbone:
    dim: 512
    ffn_dim: 2048
    shift_action: 5.0
  freeze:
  - video_backbone.text_encoder
  - video_backbone.reason1
  - video_backbone.vae
  - video_backbone.image_encoder
  - video_backbone.video_encoder
  architecture:
    framework: dual_system
    variant: joint_self_attn
    action_dim: 20
    use_proprioception: true
    state_dim: 20
    bridge_layers: null
    bridge_interval: 1
    mot_checkpoint_mixed_attn: true
    attention_mask_mode: action_sees_video
    video_attention_mask_mode: first_frame_causal
    detach_bridge: false
    idm_video_cond_noise_prob: 0.5
dataloader:
  type: robotwin
  dataset_dir: /data02/zifanz4/openwam-experiments/results/layers-20260922/native-preflight/train-data
  embodiment: aloha-agilex
  variant: clean_50
  action_mode: eef
  unify_action: false
  unify_action_map:
  - 0-9
  - 34-43
  unify_state_map: null
  num_frames: 33
  video_stride: 4
  window_stride: 1
  split: train
  height: 384
  width: 320
  multiview: true
  camera_layout:
  - head_camera
  - left_camera
  - right_camera
  target_camera: head_camera
  normalize_mode: min-max
  color_jitter:
    enabled: false
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.0
  seed: 43
  normalization_stats_path: /data02/zifanz4/openwam-experiments/endtoend-20260923/normalization_stats.npy
training:
  debug: false
  learning_rate: 3.0e-05
  adam_betas:
  - 0.9
  - 0.95
  weight_decay: 0.01
  max_grad_norm: 1.0
  num_epochs: null
  max_steps: 4000
  batch_size: 4
  gradient_accumulation_steps: 2
  lr_scheduler: cosine
  warmup_ratio: 0.05
  lr_min_ratio: 0.01
  action_lr: null
  video_lr: null
  mixed_precision: bf16
  zero_stage: 2
  use_gradient_checkpointing: true
  use_gradient_checkpointing_offload: false
  initialize_model_on_cpu: true
  offload_optimizer_device: none
  lambda_video: 1.0
  lambda_action: 1.0
  max_timestep_boundary: 1.0
  min_timestep_boundary: 0.0
  output_path: /data02/zifanz4/openwam-experiments/temporal-20260926/training/mean-seed43/output
  save_steps: 4000
  save_full_states_for_resume: false
  keep_last_k_ckpts: 1
  finetune_ckpt_path: /data02/zifanz4/openwam-experiments/endtoend-20260923/training/svae-seed43/output/2026-09-23_19-20-23
  resume_ckpt_path: null
  dataset_num_workers: 2
project:
  name: openwam
  output_dir: /data02/zifanz4/openwam-experiments/temporal-20260926/training/mean-seed43/hydra
  seed: 43
  wandb:
    project: openwam
    run_name: null
    entity: null
